<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e4f86">
  <title>SELECT CHAPTER · Opening Demo</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="opening">
    <header class="intro">
      <p class="eyebrow">A LITTLE LIGHT, A LITTLE STORY</p>
      <h1>SELECT CHAPTER</h1>
      <p class="subtitle">从哪一束微光开始？</p>
    </header>
    <section class="chapters" aria-label="选择章节">
      <button class="chapter" type="button" data-chapter="01" aria-label="选择 Chapter 01" aria-pressed="false"><img src="../assets/chapter-covers/ch01.png" alt="Chapter 01 暖色像素画封面" width="1254" height="1254"><span class="selection" aria-hidden="true">✓</span></button>
      <button class="chapter" type="button" data-chapter="02" aria-label="选择 Chapter 02" aria-pressed="false"><img src="../assets/chapter-covers/ch02.png" alt="Chapter 02 暖色像素画封面" width="1254" height="1254"><span class="selection" aria-hidden="true">✓</span></button>
      <button class="chapter" type="button" data-chapter="03" aria-label="选择 Chapter 03" aria-pressed="false"><img src="../assets/chapter-covers/ch03.png" alt="Chapter 03 暖色像素画封面" width="1254" height="1254"><span class="selection" aria-hidden="true">✓</span></button>
      <button class="chapter" type="button" data-chapter="04" aria-label="选择 Chapter 04" aria-pressed="false"><img src="../assets/chapter-covers/ch04.png" alt="Chapter 04 暖色像素画封面" width="1254" height="1254"><span class="selection" aria-hidden="true">✓</span></button>
    </section>
    <footer class="invitation">
      <p class="choice" role="status" aria-live="polite">四段故事，等你轻轻打开。</p>
      <button class="explore" type="button">开始探索 <span aria-hidden="true">↗</span></button>
    </footer>
  </main>
</body>
</html>
